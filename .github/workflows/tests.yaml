name: Extension Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Matches positron-api-tests.yaml. Both workflows use Node 22 so that
      # bumping to @vscode/test-electron 3.x (engines: node >=22) doesn't
      # split the versions.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
      - id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash
      # Cache the VS Code download, keyed by day so new stable builds are
      # picked up within 24 hours.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.get-date.outputs.date }}
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.0.1
      # The public validation API is currently in py-shiny PR #2453. Pin the
      # test dependency so future upstream changes cannot silently break CI.
      - name: Install the Python validation test environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python "shiny @ git+https://github.com/posit-dev/py-shiny.git@57911e2db49d78e18cb409832695f76d5dcdd216"
      - name: Test parity with shiny validate
        run: .venv/bin/python src/test/python/test_validate.py
      # The VS Code test host needs a display, which Linux runners lack.
      # `npm test` also type-checks and lints, by way of the pretest script.
      - name: Run extension tests
        run: xvfb-run -a npm test
      - name: Test packaged extension and missing parser assets
        env:
          SHINY_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm run vsix -- --out /tmp/shiny-test.vsix
          xvfb-run -a npm run test:vsix -- /tmp/shiny-test.vsix
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.get-date.outputs.date }}
